# /etc/nginx/sites-available/bitlink.conf
# Replace your-subdomain.duckdns.org with your actual DuckDNS domain name

server {
    listen 80;
    server_name your-subdomain.duckdns.org;

    # Redirect all HTTP traffic to HTTPS (Required for PWA & Service Workers)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-subdomain.duckdns.org;

    # SSL Certificate Paths (Managed automatically by Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/your-subdomain.duckdns.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-subdomain.duckdns.org/privkey.pem;

    # PWA Service Worker (Never cache sw.js, set Service-Worker-Allowed header)
    location /sw.js {
        proxy_pass http://127.0.0.1:5051/sw.js;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    # PWA Manifest
    location /manifest.json {
        proxy_pass http://127.0.0.1:5051/manifest.json;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=3600";
    }

    # Main Dashboard Proxy
    location / {
        proxy_pass http://127.0.0.1:5051;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 700M;
        proxy_read_timeout 86400;
    }
}
