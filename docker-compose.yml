# ============================================================
# BitLink — Docker Compose (Internal Container Database Mode)
# Runs PostgreSQL in an isolated 'db' container with persistent volume.
# ============================================================

services:

  # ----------------------------------------------------------
  # PostgreSQL 15 — sole CRM data store (isolated internal container)
  # ----------------------------------------------------------
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: bitlink
      POSTGRES_USER: bitlink
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Abdulhanan111@}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    networks:
      - bitlink-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitlink -d bitlink"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # WhatsApp Baileys Gateway — Node.js, port 3101 (internal)
  # ----------------------------------------------------------
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.node
    restart: always
    env_file:
      - .env
    environment:
      WHATSAPP_BRIDGE_URL: http://wa-bridge:${WHATSAPP_REFRESH_PORT:-8102}
    volumes:
      # WhatsApp session — must persist or QR scan is required on every restart
      - ./whatsapp-bot/auth_info:/app/whatsapp-bot/auth_info
    networks:
      - bitlink-net

  # ----------------------------------------------------------
  # Flask Control Dashboard — served on 0.0.0.0:5051
  # ----------------------------------------------------------
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.python
    restart: always
    command: python control_server.py
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://bitlink:Abdulhanan111%40@db:5432/bitlink}
      NODE_API_URL: http://gateway:3101
      GATEWAY_HOST: gateway
      WHATSAPP_BRIDGE_HOST: wa-bridge
      TELEGRAM_BRIDGE_HOST: tg-bridge
      WHATSAPP_REFRESH_PORT: ${WHATSAPP_REFRESH_PORT:-8102}
      TELEGRAM_REFRESH_PORT: ${TELEGRAM_REFRESH_PORT:-8004}
      CONTROL_DASHBOARD_PORT: ${CONTROL_DASHBOARD_PORT:-5051}
    ports:
      - "${CONTROL_DASHBOARD_PORT:-5051}:${CONTROL_DASHBOARD_PORT:-5051}"
    depends_on:
      db:
        condition: service_healthy
      gateway:
        condition: service_started
    networks:
      - bitlink-net

  # ----------------------------------------------------------
  # WhatsApp Python Bridge — relay between Baileys and Slack
  # ----------------------------------------------------------
  wa-bridge:
    build:
      context: .
      dockerfile: Dockerfile.python
    restart: always
    command: python main_whatsapp.py
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://bitlink:Abdulhanan111%40@db:5432/bitlink}
      NODE_API_URL: http://gateway:3101
      WHATSAPP_REFRESH_PORT: ${WHATSAPP_REFRESH_PORT:-8102}
      TZ: Asia/Karachi
    depends_on:
      db:
        condition: service_healthy
      gateway:
        condition: service_started
    networks:
      - bitlink-net

  # ----------------------------------------------------------
  # Telegram Python Bridge — relay between Telegram and Slack
  # ----------------------------------------------------------
  tg-bridge:
    build:
      context: .
      dockerfile: Dockerfile.python
    restart: always
    command: python main_telegram.py
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://bitlink:Abdulhanan111%40@db:5432/bitlink}
      TELEGRAM_REFRESH_PORT: ${TELEGRAM_REFRESH_PORT:-8004}
    volumes:
      - ./sessions:/app/sessions
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bitlink-net

  # ----------------------------------------------------------
  # Slack App Manager — slash commands and modals
  # ----------------------------------------------------------
  slack-manager:
    build:
      context: .
      dockerfile: Dockerfile.python
    restart: always
    command: python bitlink_manager.py
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://bitlink:Abdulhanan111%40@db:5432/bitlink}
      WHATSAPP_BRIDGE_HOST: wa-bridge
      TELEGRAM_BRIDGE_HOST: tg-bridge
      WHATSAPP_REFRESH_PORT: ${WHATSAPP_REFRESH_PORT:-8102}
      TELEGRAM_REFRESH_PORT: ${TELEGRAM_REFRESH_PORT:-8004}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bitlink-net

  # ----------------------------------------------------------
  # AI Jobs Scheduler
  # ----------------------------------------------------------
  ai-jobs:
    build:
      context: .
      dockerfile: Dockerfile.python
    restart: always
    command: python sales_ai_jobs.py
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://bitlink:Abdulhanan111%40@db:5432/bitlink}
      TZ: Asia/Karachi
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bitlink-net

# ============================================================
# Volumes — persistent database storage
# ============================================================
volumes:
  pg_data:
    driver: local

# ============================================================
# Networks
# ============================================================
networks:
  bitlink-net:
    driver: bridge
