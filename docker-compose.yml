version: '3.8'

# ============================================================
# BitLink — Docker Compose (Scenario A: Host Database Mode)
# Connects to PostgreSQL running directly on the host machine via host.docker.internal
# ============================================================

services:

  # ----------------------------------------------------------
  # WhatsApp Baileys Gateway — Node.js, port 3101 (internal)
  # ----------------------------------------------------------
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.node
    restart: always
    env_file:
      - .env
    volumes:
      # WhatsApp session — must persist or QR scan is required on every restart
      - ./whatsapp-bot/auth_info:/app/whatsapp-bot/auth_info
    networks:
      - bitlink-net

  # ----------------------------------------------------------
  # Flask Control Dashboard — served on 0.0.0.0:5050
  # ----------------------------------------------------------
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.python
    restart: always
    command: python control_server.py
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://bitlink:Abdulhanan111%40@host.docker.internal:5432/bitlink
      NODE_API_URL: http://gateway:3101
      WHATSAPP_REFRESH_PORT: "8101"
      TELEGRAM_REFRESH_PORT: "8003"
      CONTROL_DASHBOARD_PORT: "5050"
    ports:
      - "5050:5050"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      gateway:
        condition: service_started
    networks:
      - bitlink-net

  # ----------------------------------------------------------
  # WhatsApp Python Bridge — relay between Baileys and Slack
  # ----------------------------------------------------------
  wa-bridge:
    build:
      context: .
      dockerfile: Dockerfile.python
    restart: always
    command: python main_whatsapp.py
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://bitlink:Abdulhanan111%40@host.docker.internal:5432/bitlink
      NODE_API_URL: http://gateway:3101
      WHATSAPP_REFRESH_PORT: "8101"
      TZ: Asia/Karachi
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      gateway:
        condition: service_started
    networks:
      - bitlink-net

  # ----------------------------------------------------------
  # Telegram Python Bridge — relay between Telegram and Slack
  # ----------------------------------------------------------
  tg-bridge:
    build:
      context: .
      dockerfile: Dockerfile.python
    restart: always
    command: python main_telegram.py
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://bitlink:Abdulhanan111%40@host.docker.internal:5432/bitlink
      TELEGRAM_REFRESH_PORT: "8003"
    volumes:
      - ./sessions:/app/sessions
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - bitlink-net

  # ----------------------------------------------------------
  # Slack App Manager — slash commands and modals
  # ----------------------------------------------------------
  slack-manager:
    build:
      context: .
      dockerfile: Dockerfile.python
    restart: always
    command: python bitlink_manager.py
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://bitlink:Abdulhanan111%40@host.docker.internal:5432/bitlink
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - bitlink-net

  # ----------------------------------------------------------
  # AI Jobs Scheduler
  # ----------------------------------------------------------
  ai-jobs:
    build:
      context: .
      dockerfile: Dockerfile.python
    restart: always
    command: python sales_ai_jobs.py
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://bitlink:Abdulhanan111%40@host.docker.internal:5432/bitlink
      TZ: Asia/Karachi
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - bitlink-net

networks:
  bitlink-net:
    driver: bridge
